[package]
name = "marusia-d"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
glob = "0.3.4"
libc = "0.2.191"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "process", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
